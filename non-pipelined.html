<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArchiFlow Pro | Non-Pipelined Master</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020617;
      --card: #0f172a;
      --accent: #38bdf8;
      --if: #f87171; --id: #fbbf24; --ex: #34d399; --mem: #60a5fa; --wb: #f472b6;
    }
    body { 
        background: var(--bg); 
        color: #f8fafc; 
        font-family: 'Plus Jakarta Sans', sans-serif; 
        overflow: hidden; 
        height: 100vh; 
        display: flex; 
        flex-direction: column;
        padding: 0 40px;
    }
    .space-font { font-family: 'Space Grotesk', sans-serif; }
    
    /* Hardware Units - Isolated Highlighting */
    .hw-node {
      width: 150px; height: 75px;
      transition: all 0.4s ease;
      border: 1px solid #1e293b;
      background: transparent; /* Idle is invisible */
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      opacity: 0.2; /* Dimmed idle state */
    }
    
    /* ONLY Active Node Highlighting */
    .hw-node.active {
      opacity: 1;
      border-color: var(--clr) !important;
      box-shadow: 0 0 25px -5px var(--clr);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Instruction Tag Slot ABOVE Block */
    .instr-slot {
      position: absolute;
      top: -32px;
      width: 120px;
      height: 24px;
      background: #fff;
      color: #000;
      font-weight: 800;
      font-size: 10px;
      border-radius: 4px;
      display: none;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      z-index: 50;
    }

    /* Table Scrolling & Scrollbar Removal */
    .sticky-col { position: sticky; left: 0; background: #0f172a; z-index: 20; border-right: 2px solid #334155; }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Compact Table Blocks */
    .tag { padding: 3px 8px; border-radius: 4px; color: #000; font-weight: 800; font-size: 11px; }

    .pulse-neon {
      animation: neonGlow 2s infinite;
    }
    @keyframes neonGlow {
      0%, 100% { box-shadow: 0 0 5px var(--accent); transform: scale(1); }
      50% { box-shadow: 0 0 20px var(--accent); transform: scale(1.02); }
    }
  </style>
</head>
<body class="py-4">

  <header class="flex justify-between items-center mb-4">
    <div>
      <h1 class="text-4xl font-extrabold space-font tracking-tighter text-white uppercase">Non-Pipeline <span class="text-sky-400">Simulator</span></h1>
      <p class="text-slate-500 text-xs font-bold tracking-[0.2em] uppercase">Computer Architecture Visualization</p>
    </div>
    <div class="flex items-center justify-center">
        <button onclick="openModal()" class="flex items-center justify-center gap-2 px-6 py-4 bg-sky-400 border border-white text-slate-950 font-extrabold rounded-xl shadow-lg pulse-neon text-md hover:rounded-full transition-all">
            <i class="fa-solid fa-code-branch text-2xl"></i>
            <span>SET UP INSTRUCTIONS</span>
        </button>
    </div>
  </header>

  <main class="flex-1 flex flex-col gap-4 overflow-hidden">
    
    <div class="bg-slate-900/40 rounded-2xl p-10 border border-slate-800 relative">
        <div class="flex justify-around items-center relative z-10">
            <div class="hw-node" id="u0" style="--clr:var(--if)">
                <div id="t0" class="instr-slot"></div>
                <span class="text-[9px] text-slate-500 font-bold">STAGE 1</span>
                <span class="font-extrabold text-sm uppercase">Fetch</span>
            </div>
            <div class="hw-node" id="u1" style="--clr:var(--id)">
                <div id="t1" class="instr-slot"></div>
                <span class="text-[9px] text-slate-500 font-bold">STAGE 2</span>
                <span class="font-extrabold text-sm uppercase">Decode</span>
            </div>
            <div class="hw-node" id="u2" style="--clr:var(--ex)">
                <div id="t2" class="instr-slot"></div>
                <span class="text-[9px] text-slate-500 font-bold">STAGE 3</span>
                <span class="font-extrabold text-sm uppercase">Execute</span>
            </div>
            <div class="hw-node" id="u3" style="--clr:var(--mem)">
                <div id="t3" class="instr-slot"></div>
                <span class="text-[9px] text-slate-500 font-bold">STAGE 4</span>
                <span class="font-extrabold text-sm uppercase">Memory</span>
            </div>
            <div class="hw-node" id="u4" style="--clr:var(--wb)">
                <div id="t4" class="instr-slot"></div>
                <span class="text-[9px] text-slate-500 font-bold">STAGE 5</span>
                <span class="font-extrabold text-sm uppercase">Writeback</span>
            </div>
        </div>
    </div>

    
    <div class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col">
        <div class="p-5 bg-slate-800/50 border-b border-slate-700 flex justify-between items-center">
            <div>
                <h3 class="space-font text-sm font-extrabold text-sky-400 uppercase tracking-widest">Space-Time Diagram</h3>
                <p id="status" class="text-xs text-slate-300 font-bold mt-1 uppercase">Ready: Configure Program</p>
            </div>
            
            <div class="flex gap-4 items-center">
                <button id="stepBtn" onclick="nextStep()" disabled class="px-6 py-3 rounded-full font-extrabold text-xs bg-white text-black hover:bg-slate-200 disabled:opacity-10 transition-all">
                    START EXECUTION
                </button>
                <button id="playBtn" onclick="autoPlay()" disabled class="px-6 py-3 rounded-full font-extrabold text-xs bg-sky-600 text-white hover:bg-sky-500 disabled:opacity-10 transition-all">
                    AUTO PLAY
                </button>
                <button id="stopBtn" onclick="stopAutoPlay()" class="hidden px-6 py-3 rounded-full font-extrabold text-xs bg-red-600 text-white hover:bg-red-500 transition-all">
                    STOP
                </button>
                <button onclick="location.reload()" class="px-6 py-3 rounded-full font-extrabold text-xs bg-slate-700 text-white hover:bg-slate-600">
                    RESET
                </button>
                
                <div class="ml-4 flex gap-6 border-l border-slate-700 pl-6">
                    <div class="text-right">
                        <span class="text-[10px] text-slate-500 font-bold block uppercase">Time</span>
                        <span id="timeVal" class="text-lg text-white font-extrabold">0.00 ns</span>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] text-slate-500 font-bold block uppercase">Cycles</span>
                        <span id="clkVal" class="text-lg text-sky-400 font-extrabold">0</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-auto no-scrollbar" id="mainScroll">
            <div class="overflow-x-auto no-scrollbar" id="xScroll">
                <table class="w-full border-collapse">
                    <thead><tr id="thr" class="text-[11px] text-slate-500 uppercase font-bold"><th class="sticky-col p-5 text-left border-b border-slate-800">Instruction</th></tr></thead>
                    <tbody id="tbr"></tbody>
                </table>
            </div>
        </div>
    </div>
  </main>

  <div id="modal" class="fixed inset-0 bg-slate-950/90 z-[100] flex items-center justify-center p-4 hidden">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl">
        <h2 class="space-font text-2xl font-extrabold text-white mb-2 uppercase">System Config</h2>
        <p class="text-slate-400 text-xs mb-6 uppercase">Set your workload to begin</p>
        <div class="space-y-6">
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase">Input Mode</label>
                <select id="mode" onchange="toggleInp()" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 mt-2 text-sm text-white outline-none">
                    <option value="num">Instruction Count</option>
                    <option value="custom">Custom Assembly Strings</option>
                </select>
            </div>
            <div id="numInp">
                <label class="text-xs font-bold text-slate-500 uppercase">Total Instructions (1-20)</label>
                <input type="number" id="instrNum" value="5" min="1" max="20" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 mt-2 text-sm text-white">
            </div>
            <div id="customInp" class="hidden">
                <label class="text-xs font-bold text-slate-500 uppercase">Program (e.g. ADD, SUB, LOAD)</label>
                <textarea id="instrText" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 mt-2 text-sm text-white h-24" placeholder="ADD, SUB, LOAD"></textarea>
            </div>
            <button onclick="initSim()" class="w-full py-4 bg-sky-500 text-slate-950 font-extrabold rounded-xl uppercase text-xs">
                Initialize Simulation
            </button>
        </div>
    </div>
  </div>

  <script>
    let instructions = [];
    let clk = 0, iIdx = 0, sIdx = 0, playInt = null;
    const colors = ['#f87171', '#fbbf24', '#34d399', '#60a5fa', '#f472b6'];
    const names = ['IF', 'ID', 'EX', 'MEM', 'WB'];

    function toggleInp() {
        const isCustom = document.getElementById('mode').value === 'custom';
        document.getElementById('numInp').classList.toggle('hidden', isCustom);
        document.getElementById('customInp').classList.toggle('hidden', !isCustom);
    }
    
    function openModal() { document.getElementById('modal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('modal').classList.add('hidden'); }

    function initSim() {
        const mode = document.getElementById('mode').value;
        if(mode === 'num') {
            const num = document.getElementById('instrNum').value;
            instructions = Array.from({length: num}, (_, i) => "INST "+(i+1));
        } else {
            instructions = document.getElementById('instrText').value.split(',').map(s=>s.trim()).filter(s=>s!=="");
        }
        if(!instructions.length) return;

        clk=0; iIdx=0; sIdx=0;
        document.getElementById('clkVal').innerText = "0";
        document.getElementById('timeVal').innerText = "0.00 ns";
        document.getElementById('stepBtn').disabled = false;
        document.getElementById('playBtn').disabled = false;
        document.getElementById('stepBtn').innerText = "START EXECUTION";
        document.getElementById('status').innerText = "CPU READY: (" + instructions.length + " INST)";
        
        document.getElementById('thr').innerHTML = `<th class="sticky-col p-5 text-left border-b border-slate-800">Instruction</th>`;
        document.getElementById('tbr').innerHTML = instructions.map((ins, i) => `
            <tr id="r-${i}" class="border-b border-slate-800">
                <td class="sticky-col p-5 font-extrabold text-[10px] text-sky-400 uppercase tracking-tighter">${ins}</td>
            </tr>`).join('');
        
        closeModal();
    }

    function moveToken(idx) {
        // Clear all previous slots
        for(let i=0; i<5; i++) {
            const el = document.getElementById('t' + i);
            el.style.display = "none";
            el.innerHTML = "";
        }
        
        if(idx === -1) return;

        const slot = document.getElementById('t' + idx);
        slot.style.display = "flex";
        slot.innerHTML = instructions[iIdx];
    }

    function nextStep() {
        if(iIdx >= instructions.length) { stopAutoPlay(); return; }
        
        document.getElementById('stepBtn').innerText = "STEP NEXT CYCLE";
        clk++;
        document.getElementById('clkVal').innerText = clk;
        document.getElementById('timeVal').innerText = (clk * 2.0).toFixed(2) + " ns";

        // Isolate Highlight logic
        document.querySelectorAll('.hw-node').forEach(u => u.classList.remove('active'));
        document.getElementById('u'+sIdx).classList.add('active');
        moveToken(sIdx);
        document.getElementById('status').innerText = `EXECUTING: ${instructions[iIdx]} [${names[sIdx]}]`;

        const thr = document.getElementById('thr');
        if(thr.cells.length <= clk) {
            thr.innerHTML += `<th class="p-5 text-center border-b border-slate-800 min-w-[90px]">Cycle ${clk}</th>`;
            for(let r=0; r<instructions.length; r++) {
                document.getElementById('r-'+r).insertCell(-1).className = "p-3 border-l border-slate-800 text-center";
            }
        }

        const cell = document.getElementById('r-'+iIdx).cells[clk];
        cell.innerHTML = `<span class="tag" style="background:${colors[sIdx]}">${names[sIdx]}</span>`;

        // Automatic Tracking Scrolling
        const mainScroll = document.getElementById('mainScroll');
        const xScroll = document.getElementById('xScroll');
        const activeRow = document.getElementById('r-'+iIdx);
        
        xScroll.scrollLeft = xScroll.scrollWidth;
        mainScroll.scrollTop = activeRow.offsetTop - 100;

        sIdx++;
        if(sIdx > 4) { sIdx = 0; iIdx++; }
        
        if(iIdx >= instructions.length) {
            document.getElementById('stepBtn').disabled = true;
            document.getElementById('playBtn').disabled = true;
            document.querySelectorAll('.hw-node').forEach(u => u.classList.remove('active'));
            moveToken(-1);
            document.getElementById('status').innerText = `EXECUTION COMPLETE`;
            stopAutoPlay();
        }
    }

    function autoPlay() {
        document.getElementById('playBtn').classList.add('hidden');
        document.getElementById('stopBtn').classList.remove('hidden');
        playInt = setInterval(nextStep, 600);
    }

    function stopAutoPlay() {
        clearInterval(playInt);
        document.getElementById('playBtn').classList.remove('hidden');
        document.getElementById('stopBtn').classList.add('hidden');
    }
  </script>
</body>
</html>
